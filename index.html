
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>eFlow</title>
      <link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg?v=2" />
      <style>
        html, body {
          height: 100%;
          margin: 0;
        }
        #root {
          height: 100%;
        }
        .eflow-loading {
          --loading-brand: #01006b;
          --loading-text: #182b35;
          --loading-muted: #61727d;
          position: relative;
          isolation: isolate;
          min-height: 100vh;
          min-height: 100dvh;
          width: 100%;
          display: grid;
          place-items: center;
          overflow: hidden;
          box-sizing: border-box;
          padding: 56px 24px 90px;
          color: var(--loading-text);
          background: radial-gradient(ellipse at 50% 39%, #e6f4f5 0%, #f5f8fc 42%, #fafbfc 75%);
          font-family: "Figtree Variable", system-ui, sans-serif;
        }
        .eflow-loading::before {
          content: "";
          position: absolute;
          z-index: -1;
          inset: 0;
          opacity: .2;
          background-image: radial-gradient(#90a9ba .7px, transparent .7px);
          background-size: 24px 24px;
          mask-image: radial-gradient(ellipse at center, #000, transparent 65%);
        }
        .eflow-loading-content {
          display: flex;
          align-items: center;
          flex-direction: column;
          width: 100%;
          max-width: 360px;
          text-align: center;
          animation: eflow-loading-enter .3s ease-out both;
        }
        .eflow-loading-logo { height: 58px; margin-bottom: 16px; }
        .eflow-loading-logo > div { cursor: default; }
        .eflow-loading-logo svg { display: block; height: 100%; width: auto; }
        .eflow-loading-logo svg > path,
        .eflow-loading-logo svg g path:last-child { fill: var(--loading-brand); }
        .eflow-loading-organization { color: var(--loading-muted); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; }
        .eflow-loading h1 { font-size: clamp(20px, 4.8vw, 24px); font-weight: 600; line-height: 1.3; letter-spacing: -.025em; margin: 42px 0 24px; }
        .eflow-loading-track { width: 168px; height: 3px; border-radius: 8px; overflow: hidden; background: #dce7ee; }
        .eflow-loading-track span { display: block; width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #0073ea, #0c8c88); animation: eflow-loading-sweep 1.6s ease-in-out infinite; }
        .eflow-loading p { font-size: 13px; line-height: 1.5; color: var(--loading-muted); margin: 16px 0 0; }
        .eflow-loading-footer { position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); left: 24px; right: 24px; text-align: center; color: var(--loading-muted); font-size: 11px; line-height: 1.6; }
        .eflow-loading-ring { transform-box: fill-box; transform-origin: center; animation: eflow-loading-spin 1.1s linear infinite; }
        .dark .eflow-loading { --loading-brand: #f2f5ff; --loading-text: #edf5fa; --loading-muted: #9aaebb; background: radial-gradient(ellipse at 50% 39%, #112e3c, #101b2b 48%, #0e1723 85%); }
        .dark .eflow-loading-track { background: #2b3c4e; }
        @keyframes eflow-loading-spin { to { transform: rotate(360deg); } }
        @keyframes eflow-loading-sweep { 0% { transform: translateX(-105%); } 100% { transform: translateX(330%); } }
        @keyframes eflow-loading-enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
          .eflow-loading-content, .eflow-loading-ring, .eflow-loading-track span { animation: none; }
          .eflow-loading-track span { width: 100%; opacity: .6; }
        }
      </style>
    </head>
